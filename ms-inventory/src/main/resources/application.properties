spring.application.name=ms-inventory
# Asignamos un puerto específico para que no choque con los demás microservicios
server.port=8082 

spring.datasource.url=jdbc:mysql://localhost:3306/nexus_inventory_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# 2. ACTIVAR FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 3. APAGAR HIBERNATE (Flyway toma el control)
spring.jpa.hibernate.ddl-auto=validate