spring.application.name=ms-notifications
server.port=8078
# 1. CONEXIÓN A LA ISLA DE BASE DE DATOS DE AUTH
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_notifications_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# 2. ACTIVAR FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 3. APAGAR HIBERNATE (Flyway toma el control)
spring.jpa.hibernate.ddl-auto=validate