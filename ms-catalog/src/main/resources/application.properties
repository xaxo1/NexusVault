spring.application.name=ms-catalog
#Le asignamos el 8081 al catálogo
server.port=8081

# 1. CONEXIÓN A LA BASE DE DATOS DE CATALOG
# Agregamos createDatabaseIfNotExist para que MySQL la cree sola si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/nexus_catalog_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# 2. ACTIVAR FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 3. APAGAR HIBERNATE (Flyway toma el control)
spring.jpa.hibernate.ddl-auto=validate